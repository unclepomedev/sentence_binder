[package]
name = "sentence_binder"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sentence_binder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
tokio = { version = "1.54.1", features = ["full"] }
core-foundation = "0.10.1"
core-graphics = "0.25"
arboard = "3.7.0"
lazy_static = "1.5.1"
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
wiremock = "0.6.5"
